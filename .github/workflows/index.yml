# Daily index of public employer feeds. This file runs from main.
# Shards are written to the index-data branch. They are not files on main.
# A sharp drop opens an issue and does not publish. ATS requests use no token.
#
# On the git 2.56 runner a Bearer extraheader was not a credential:
# git asked for a username and the step exited 128. The push now uses
# the same Basic header as actions/checkout. The base64 form of the
# token is masked, then removed from git config. The fetch is the full
# branch so the next push is not a shallow update, which GitHub rejects.

name: Index

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r repo/requirements.txt

      - name: Prepare the data branch
        env:
          GIT_TERMINAL_PROMPT: "0"
          TOKEN: ${{ github.token }}
        run: bash repo/scripts/index-data-remote.sh prepare data "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Fetch the public boards
        id: index
        working-directory: repo
        run: |
          set +e
          python -m indexer run --sources sources --data ../data --root .
          code=$?
          set -e
          report="../data/report.json"
          if [ "$code" -eq 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            if [ ! -f "$report" ]; then
              echo "Indexer exited 3 (hold) but ${report} does not exist." >&2
              exit 1
            fi
            python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); sys.exit(0 if d.get("publish") is False else 1)' "$report" \
              || { echo "Indexer exited 3 but report.json does not set publish to false." >&2; exit 1; }
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Indexer failed with exit ${code}. A held publish is exit 3 and writes report.json." >&2
            exit "$code"
          fi

      - name: Open an issue instead of publishing a bad snapshot
        if: steps.index.outputs.publish == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "data/report.json";
            if (!fs.existsSync(path)) {
              throw new Error(
                "data/report.json does not exist. A held publish must exit 3 and write that file. This step will not open an issue."
              );
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            if (report.publish !== false) {
              throw new Error("data/report.json does not set publish to false. Refusing to open a hold issue.");
            }
            const marker = "<!-- openjob-index -->";
            const dropped = (report.dropped || []).join(", ");
            const body = [
              marker,
              `The index was not published. These feeds dropped by half or more: ${dropped}.`,
              "The previous snapshot on `index-data` is unchanged.",
              "```json",
              JSON.stringify({ before: report.before, after: report.after }, null, 2),
              "```",
            ].join("\n");
            const title = "Index held: a feed count dropped sharply";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Note boards hidden after 48 hours
        if: steps.index.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "data/report.json";
            if (!fs.existsSync(path)) {
              throw new Error("data/report.json does not exist, so hidden boards cannot be reported.");
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const hidden = report.hidden || [];
            if (!hidden.length) return;
            const marker = "<!-- openjob-index-stale -->";
            const lines = hidden.map((board) => `- ${board.slug} (${board.ats} / ${board.board})`);
            const body = [
              marker,
              "These boards have failed for 48 hours and are hidden from the index.",
              ...lines,
            ].join("\n");
            const title = "Index: a board is hidden after 48 hours";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Publish the data branch
        if: steps.index.outputs.publish == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
          TOKEN: ${{ github.token }}
        run: bash repo/scripts/index-data-remote.sh publish data

      # pages.yml has workflow_dispatch, which this token is allowed to start.
      # actions: write above is what createWorkflowDispatch requires.
      # The workflow id is the file name and the ref is main, matching Auto-merge.
      - name: Refresh the site
        if: steps.index.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              ref: "main",
            });
