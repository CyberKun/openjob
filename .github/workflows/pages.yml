name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # A missing index-data branch is the first deploy. Any other fetch error fails.
      - name: Fetch indexed jobs
        run: bash scripts/fetch-index-data.sh index-data
      - name: Build the search index and permalink pages
        env:
          PAGES_ORIGIN: ${{ vars.PAGES_ORIGIN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: python -m validator build-index --root . --out site/index.json --pages site --index-data index-data --datasets-out build/datasets
      - uses: actions/upload-artifact@v4
        with:
          name: openjob-datasets
          path: build/datasets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-api:
    if: ${{ vars.OPENJOB_API_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: openjob-datasets
          path: build/datasets
      - run: npm ci
        working-directory: worker
      - name: Publish the complete catalog snapshot to R2
        run: bash scripts/upload-datasets-to-r2.sh build/datasets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      - run: npm run typecheck && npm test && npx cf build && npx cf deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
